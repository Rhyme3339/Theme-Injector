<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <style>
    body {
      width: 220px;
      font-family: system-ui, sans-serif;
      padding: 12px;
      background: #1e1e1e;
      color: #eee;
    }
    h1 {
      font-size: 14px;
      margin: 0 0 8px;
    }
    #site {
      font-size: 12px;
      color: #aaa;
      margin-bottom: 12px;
      word-break: break-all;
    }
    .modes {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }
    .mode-btn {
      border: 2px solid transparent;
      border-radius: 8px;
      padding: 10px 6px;
      font-size: 12px;
      font-weight: 600;
      color: #fff;
      cursor: pointer;
      text-shadow: 0 1px 2px rgba(0,0,0,0.4);
    }
    .mode-btn.active {
      border-color: #fff;
    }
    #none-btn { background: #444; }
    #dark-btn { background: #111; }
    #romance-btn { background: linear-gradient(135deg, #ff0057, #7a0026); }
    #sky-btn { background: linear-gradient(135deg, #87ceeb, #3b8fc7); }
    #sea-btn { background: linear-gradient(135deg, #009688, #00567a); }
    #magic-btn { background: linear-gradient(135deg, #9400ff, #4b0082); }
  </style>
</head>
<body>
  <h1>✨ Theme Injector</h1>
  <div id="site">Loading...</div>
  <div class="modes">
    <button class="mode-btn" id="none-btn" data-mode="none">None</button>
    <button class="mode-btn" id="dark-btn" data-mode="dark">🌙 Dark</button>
    <button class="mode-btn" id="romance-btn" data-mode="romance">❤️ Romance</button>
    <button class="mode-btn" id="sky-btn" data-mode="sky">☁️ Sky</button>
    <button class="mode-btn" id="sea-btn" data-mode="sea">🌊 Sea</button>
    <button class="mode-btn" id="magic-btn" data-mode="magic">🔮 Magic</button>
  </div>
  <script src="popup.js"></script>
</body>
</html>
